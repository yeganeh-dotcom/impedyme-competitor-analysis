          "text": "Duke Energy, headquartered in Charlotte, North Carolina, is one of the largest energy holding companies in the United States, delivering electricity to millions of customers across the Carolinas, Florida, and the Midwest. As inverter-based resources, storage, and power electronics spread across its system, the equipment connecting to the grid has to be proven under the conditions the grid will actually present. In Duke Energy's own words, validating grid-connected equipment requires more than a stable AC source or a conventional resistive load. The test system must reproduce normal grid conditions, voltage and frequency disturbances, unbalance, harmonics, impedance, and bidirectional power flow while safely absorbing or returning energy. Separate source, load, control, measurement, and protection systems create complex interfaces, fragmented data, and long setup cycles. Duke Energy needed programmable grid conditions and bidirectional loading as one coordinated system — with the electrical, controls, communications, measurement, and interlock integration to make it run safely and repeatably."

          "text": "Impedyme delivered a coordinated Grid Emulator and bidirectional regenerative Load Bank built on the CHP Series in 19-inch, 42U liquid-cooled cabinets. Every CHP module is a regenerative, four-quadrant, bidirectional power stage with its own AMD/Xilinx Zynq UltraScale+ quad-core Arm processor and 600K-cell FPGA running IMPEDYME-RT — a Linux OS with Impedyme's proprietary real-time kernel that executes MATLAB/Simulink models directly on the Arm cores and the FPGA with a 200 ns FPGA update rate. CHP modules are offered across a power range from 5 kW to 50 kW, scalable to 5 MW, so the same architecture sizes to the program. On the grid side, GridSim Studio configures the emulator as a four-quadrant programmable grid source: voltage and frequency profiles, phase unbalance and disturbances, harmonic injection, and an RLC grid impedance emulated inside the FPGA. On the opposite power interface of the device under test, the regenerative Load Bank sinks or sources power at commanded operating points — and returns energy through the test architecture instead of burning it as heat. Impedyme also delivered the integration: analog and digital I/O, communications, E-stop and interlock circuits, measurement scaling, control sequences, and data capture, interfaced to the DUT, the laboratory controls, and the facility power infrastructure. PowerHIL Studio sequences the tests and enforces the safety envelope; FPGA Scope captures every port synchronously; MLX returns the results to MATLAB for analysis and reporting."
