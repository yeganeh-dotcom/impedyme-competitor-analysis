          "name": "The Challenge — One controller family, many motors",
          "text": "Flex is one of the world's leading manufacturing and technology partners, and its automotive business — Flex Automotive GmbH in Filderstadt, Germany — develops modular zone-controller platforms for software-defined vehicles: eFuses, high- and low-side switches, motor and actuator drivers, and in-vehicle networking in configurable, pre-validated building blocks. In Flex's own words, the new zone-controller portfolio must operate a range of low-current brushed and brushless DC motor loads. Conventional verification depends on physical motors, wiring harnesses, and mechanical fixtures that vary from one motor type to another — which makes it difficult to reproduce current profiles, startup behavior, stall conditions, back EMF, regeneration, and fault cases consistently across controller variants and software releases. Flex needed one reusable verification environment for every motor output and product configuration — programmable motor behavior across the full 1 A to 30 A range, synchronized with automated test sequences."
        },
        {
          "@type": "WebPageElement",
          "@id": "https://impedyme.com/customers/flex-automotive#the-solution",
          "name": "The Solution — An emulated motor for every output",
          "text": "Impedyme configured a Motor Emulator Testbench built on the CHP Series in a 19-inch, 42U liquid-cooled cabinet, sized for the zone controller's 1 A to 30 A motor outputs. Programmable real-time motor models run directly on the module's FPGA — AMD/Xilinx Zynq UltraScale+, quad-core Arm + 600K logic cells under IMPEDYME-RT — behind a bidirectional, four-quadrant electrical interface, so each controller output drives what it sees as a real machine, at real current. In MotorSim Studio, engineers select brushed or brushless DC motor models and set winding resistance and inductance, back EMF, inertia, friction, and mechanical loading, along with speed and torque profiles and operating sequences. The same controlled motor behavior repeats identically across controller hardware, firmware, and calibration revisions. A Fault Inject Unit, accessed over Ethernet and controlled from PowerHIL Studio, applies short-circuit cases (DC link, phase-to-phase, phase-to-ground, and sensor lines) and open-circuit cases on demand. PowerHIL Studio sequences the campaigns and enforces safety limits; FPGA Scope captures synchronized voltage, current, speed, position, and status data; an optional environmental chamber (1000 L, 0–80 °C, 15–95 % RH) extends the same tests across temperature and humidity."
        },
        {
          "@type": "WebPageElement",

          "name": "In Practice — Startup to stall, reversal to regeneration",
          "text": "A representative test connects a zone-controller motor output directly to the Impedyme Motor Emulator. The emulator reproduces the selected brushed or brushless motor — winding resistance and inductance, back EMF, inertia, friction, and mechanical loading — and engineers evaluate startup, acceleration, steady operation, reversal, braking, regeneration, stall response, current limiting, open-load behavior, and selected electrical faults under controlled and repeatable conditions. Because motor models are reusable and currents sweep across the full 1 A to 30 A range in software, the same automated regression sequence runs against every zone-controller variant — and again after every hardware or software change — with the controller's own eFuses and protection logic responding to each case."
        },

          "@id": "https://impedyme.com/customers/flex-automotive#architecture",
          "name": "Architecture — Testbed configuration",
          "text": "Figure 1 — The Flex Automotive testbed: the CHP Series module emulates brushed and brushless DC motors on the zone controller's outputs from 1 A to 30 A, while the Fault Inject Unit and PowerHIL Studio script fault and regression campaigns captured in FPGA Scope. The platform is sized for growth: PowerHIL Studio configures additional CHP modules and channels, four SFP+ ports per module (up to 12.5 Gbps) daisy-chain control and measurement for parallel and multiphase operation, and eight standard analog inputs per module (up to 2.5 MS/s) bring external measurements into the loop — so the same architecture extends from one output to the full portfolio, with CHP modules offered from 5 kW to 50 kW, scalable to 5 MW."
        },

          "text": "MotorSim Studio: brushed and brushless DC motor models on the FPGA; winding R and L, back EMF, inertia, friction, and mechanical-load profiles; parameter variation and LUT management. PowerHIL Studio: cabinet-level control, signal routing, safety monitoring, automated regression sequencing, failure emulation, and Fault Inject Unit control. IMPEDYME-RT: Linux with proprietary real-time kernel running MATLAB/Simulink models on Arm + FPGA (200 ns). FPGA Scope: real-time capture of voltage, current, speed, position, and status. MLX: operating-point sweeps, efficiency and response metrics, pass/fail overlays, automated test reports."

          "text": "The emulator creates a common verification workflow for the zone-controller portfolio. Test engineers load reusable brushed or brushless motor models, sweep current and operating conditions from approximately 1 A to 30 A, automate regression sequences, and capture synchronized voltage, current, speed, position, and status data — reducing bench reconfiguration and improving consistency between development teams and product variants. The measured impact, as reported and approved by Flex Automotive: development time down 30 %, testing time down 45 %, validation time down 40 %, and testing costs down 30 %; engineering productivity up 40 %, test coverage up 50 %, system safety up 55 %, and confidence before hardware deployment up 50 %. Replacing repeated motor and fixture changes with software-defined configurations accelerates verification, and reusable automated tests apply to each variant and rerun after hardware or software changes. The platform enables repeatable startup, stall, rapid load-change, reversal, regenerative, current-limit, parameter-variation, and fault-oriented cases across the 1 A to 30 A range — conditions that are difficult to reproduce precisely and safely with a collection of physical brushed and brushless motors. For a platform built from pre-validated blocks, the testbench completes the story: every output proven the same way the platform is built — modular, repeatable, and by design."
