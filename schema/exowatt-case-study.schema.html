          "name": "The Challenge — Testing a grid that isn't there yet",
          "text": "Exowatt, founded in 2023 and headquartered in Miami, Florida, develops modular, 24/7 dispatchable solar power systems for AI data centers and heavy industry. Its flagship Exowatt P3 — a 40-foot container system — replaces photovoltaic panels and lithium-ion batteries with a thermal architecture: lenses concentrate sunlight into high-temperature heat stored in long-lasting ceramic bricks, and a heat engine converts that heat back into electricity on demand. Between the heat engine and the data-center or grid connection sits a power-conversion stage that must interface cleanly with both. At the heart of that stage is a solid-state transformer: a multi-stage power-electronic converter that replaces the passive line-frequency transformer with an actively controlled AC/DC front end, a DC link, and an isolated DC/DC stage. The SST's behavior — its ride-through, its harmonic interaction with the grid impedance, its islanding and reconnection logic, its response to load steps — is defined by firmware, and that firmware has to be proven under grid conditions the real grid will not deliver on request. Validating grid-forming inverter controls and power-conversion architectures for a novel thermal energy storage system required testing scenarios that are impractical or unsafe to replicate with full hardware: paralleled sources on a shared DC bus, grid transients, fault conditions, and energy mixing between battery storage and generation assets. Iterating controls directly on prototype hardware was slow, high-risk, and gated by hardware availability. Conventional alternatives fell short as well — stitching a real-time simulator and separate power amplifiers together from different vendors adds toolchains, cost, and integration risk, and gives no single environment in which to reproduce IEEE 1547 / UL 1741 scenarios at real power. Because the SST sits between two emulated networks — the grid on one side and the load on the other — Exowatt needed both ends of the converter to be programmable, bidirectional, and synchronized so that a disturbance injected on the grid side and the resulting load-side response could be captured in the same real-time frame. Figure 1 — Representative SST test setup: CHP Series cabinets act as both source and load around the solid-state transformer under test — one emulating the utility grid feeding the SST, the other emulating a data-center load profile — so grid events and load behavior are reproduced at real power with the energy recirculated between them."
        },
        {
          "@type": "WebPageElement",
          "@id": "https://impedyme.com/customers/exowatt#the-solution",
          "name": "The Solution — One cabinet: grid, load, simulator, and DAQ",
          "text": "Impedyme delivered a Power HIL Testbench built on CHP Series modules in a single 19-inch, 42U liquid-cooled cabinet. Each CHP module is a regenerative, four-quadrant, bidirectional power stage with its own AMD/Xilinx Zynq UltraScale+ quad-core Arm processor and 600K-cell FPGA running IMPEDYME-RT — a Linux OS with Impedyme's proprietary real-time kernel that executes MATLAB/Simulink models directly on the Arm cores and the FPGA with a 200 ns FPGA update rate. CHP modules are offered across a power range from 5 kW to 50 kW, scalable to 5 MW, so the same architecture sizes to the program. The source side is configured in GridSim Studio as the utility grid: a three-phase voltage source with programmable voltage, frequency, phase, and sequence, an RLC grid impedance emulated inside the FPGA, harmonic injection from the 3rd to the 11th order per phase, and stored disturbance profiles for sags, swells, frequency excursions, and phase faults that map directly onto the IEEE 1547 / UL 1741 ride-through curves. The load side runs Exowatt's Simulink load model in real time — a DC or AC load that can be a battery, a PV string, or a data-center profile with IT and cooling-VSD harmonics and training-load voltage fluctuations — and can just as easily source power back into the SST for reverse-flow cases. The SST connects between the source and load sides on the front-panel busbar. Power flows from the emulated grid, through the SST, into the emulated load and back onto the shared DC bus, so the facility supplies only the losses — 94 %+ of the test power is recirculated. PowerHIL Studio sequences the tests, injects failures (phase loss, short circuit, thermal faults), and enforces the safety envelope; FPGA Scope captures every port synchronously; MLX brings the results back into MATLAB for analysis and automated reporting."
        },

          "name": "In Practice — Generator-to-DC-bus converter, validated without the genset",
          "text": "A 240 Vac to 800 Vdc power converter, intended to interface a generator to Exowatt's DC bus, was validated entirely on the testbed: the AC side of the converter is driven by an emulated source with the generator's dynamics embedded in the real-time model, while the 800 Vdc side is emulated as a voltage source representing the DC bus. The converter is evaluated exactly as if a physical genset were connected — including its dynamic behavior — without the genset present in the lab. Testing against the real generator at this stage would have been impractical and would not have offered the same repeatability or safety. Grid emulation extends the same idea to the AC network: any configuration — 480 Vac three-phase, 240 Vac single-phase, 60 Hz or 50 Hz — is reproduced on demand, without that grid being physically available."
