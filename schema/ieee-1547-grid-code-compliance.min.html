me","description":"Impedyme real-time simulation platforms are deployed by power electronics R&D, validation, and test-lab teams across EV powertrain, grid integration, and inverter development worldwide.","publisher":{"@id":"https://impedyme.com/#organization"},"inLanguage":"en","potentialAction":{"@type":"SearchAction","target":{"@type":"EntryPoint","urlTemplate":"https://impedyme.com/?s={search_term_string}"},"query-input":"required name=search_term_string"}},{"@type":"WebPage","@id":"https://impedyme.com/resource-center/ieee-1547-grid-code-compliance-testing/#webpage","url":"https://impedyme.com/resource-center/ieee-1547-grid-code-compliance-testing/","name":"Testing to IEEE 1547 with the CHP Series | Impedyme","description":"A complete guide to IEEE 1547 grid code compliance testing: how IEEE Std 1547 and IEEE Std 1547.1 relate, what a conformance bench must do, and all 28 type-test scenarios explained.","isPartOf":{"@id":"https://impedyme.com/#website"},"inLanguage":"en","datePublished":"2026-08-23T09:00:00-04:00","dateModified":"2026-08-23T09:00:00-04:00","breadcrumb":{"@id":"https://impedyme.com/resource-center/ieee-1547-grid-code-compliance-testing/#breadcrumb"},"primaryImageOfPage":{"@id":"https://impedyme.com/resource-center/ieee-1547-grid-code-compliance-testing/#ieee-1547-grid-code-compliance-testing-chp-series-16x9"},"image":{"@id":"https://impedyme.com/resource-center/ieee-1547-grid-code-compliance-testing/#ieee-1547-grid-code-compliance-testing-chp-series-16x9"},"thumbnailUrl":"https://impedyme.com/wp-content/uploads/2026/08/ieee-1547-grid-code-compliance-testing-chp-series-16x9.jpg","mainEntity":{"@id":"https://impedyme.com/resource-center/ieee-1547-grid-code-compliance-testing/#article"},"hasPart":[{"@id":"https://impedyme.com/resource-center/ieee-1547-grid-code-compliance-testing/#faq"}],"about":[{"@id":"https://impedyme.com/#topic-grid-code-compliance"},{"@id":"https://impedyme.com/#topic-der"},{"@id":"https://impedyme.com/#topic-phil"},{"@id":"https://impedyme.com/#topic-hil"}],"audience":[{"@id":"https://impedyme.com/#audience-rts"},{"@id":"https://impedyme.com/#audience-ieee1547"}],"publisher":{"@id":"https://impedyme.com/#organization"},"relatedLink":["https://impedyme.com/grid-emulator/","https://impedyme.com/grid-simulation-software/","https://impedyme.com/powerhardware-in-the-loop/","https://impedyme.com/hardware-in-the-loop/"],"speakable":{"@type":"SpeakableSpecification","cssSelector":["h1",".entry-summary","#faq"]}},{"@type":"BreadcrumbList","@id":"https://impedyme.com/resource-center/ieee-1547-grid-code-compliance-testing/#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://impedyme.com/"},{"@type":"ListItem","position":2,"name":"Resource Center","item":"https://impedyme.com/resource-center/"},{"@type":"ListItem","position":3,"name":"Testing to IEEE 1547 with the CHP Series"}]},{"@type":"TechArticle","@id":"https://impedyme.com/resource-center/ieee-1547-grid-code-compliance-testing/#article","headline":"Testing to IEEE 1547 with the CHP Series","alternativeHeadline":"Grid code compliance testing and the full IEEE 1547.1 type-test programme, 28 scenarios explained","name":"Testing to IEEE 1547 with the CHP Series","description":"A complete guide to IEEE 1547 grid code compliance testing: how IEEE Std 1547 and IEEE Std 1547.1 relate, what a conformance bench must do, and all 28 type-test scenarios explained.","abstract":"Grid code compliance is where a distributed energy resource stops being an engineering achievement and becomes a product a utility will allow onto its network. This guide sets out what grid code compliance testing involves, how IEEE Std 1547 (the requirements standard) and IEEE Std 1547.1 (the conformance test procedures standard) relate, what the type-test programme demands of a bench, and then walks through all twenty-eight type-test scenarios — what each proves, what the bench applies, what is measured, and what counts as a pass.","articleBody":"Grid code compliance is the point at which a distributed energy resource stops being an engineering achievement and becomes a product a utility will actually allow onto its network. It is also, for most manufacturers, the longest and least predictable phase of the development programme. A converter that performs beautifully on the bench can still fail a conformance campaign on a ride-through profile, a settling time, or a reporting requirement — and each failure costs weeks of laboratory time that was booked months in advance.\n\nThis guide explains what grid code compliance testing actually involves, how IEEE Std 1547 and IEEE Std 1547.1 relate to one another, and what the full type-test programme demands of a test bench. We then walk through all twenty-eight type-test scenarios in the conformance programme, one by one, describing what each proves, what the bench applies, what is measured, and what counts as a pass. If you are planning a certification campaign, or building the bench that will support one, this is the map of the territory.\n\nWhat Grid Code Compliance Actually Means\n\nA grid code is the set of technical rules a network operator imposes on anything that connects to its system. Historically these rules were short, because distributed generation was rare and its aggregate effect on the network was negligible. A converter was expected to disconnect quickly when conditions went abnormal, and little else was asked of it.\n\nThat expectation has completely inverted. With inverter-based resources supplying a large and growing share of generation, a fleet that disconnects at the first disturbance is itself the disturbance. Modern grid codes therefore require the opposite behaviour: distributed resources must stay connected through voltage and frequency excursions, and must actively support the network through reactive power exchange, active power curtailment, and frequency-droop response.\n\nGrid code compliance testing is the process of proving, under controlled and repeatable laboratory conditions, that a given piece of equipment behaves the way the code requires. It is not a functional check. It is a structured programme of adversarial tests in which the bench deliberately drives the terminal into conditions the equipment will rarely, if ever, see in service, and records precisely how it responds.\n\nIEEE 1547 and IEEE 1547.1: The Requirement and the Procedure\n\nThe most common point of confusion in this field is the relationship between the two standards. It resolves cleanly once stated:\n\nIEEE Std 1547 is the requirements standard. It defines what a distributed energy resource must do — the interconnection and interoperability behaviour expected of it during normal operation, during abnormal voltage and frequency conditions, and at the moment of connection and disconnection. It is the \"what.\"\n\nIEEE Std 1547.1 is the conformance test procedures standard. It specifies the type, production, commissioning, and periodic tests and evaluations that must be performed to confirm that equipment conforms to IEEE Std 1547. It is the \"how.\"\n\nOne states the obligation; the other states how the obligation is demonstrated. A claim of compliance with the requirements standard means very little on its own. A conformance report produced by following the test-procedure standard is what actually travels — to a certification body, to a utility, to an interconnection review.\n\nIt is worth noting what the test-procedure standard explicitly does not do. It does not cover product safety testing, and it does not itself define a certification process, although its procedures are routinely used as the technical basis for one. It also does not specify measurement techniques, leaving those to established metrology practice. Design and performance criteria for the equipment itself are equally out of scope — the standard tests behaviour, not architecture.\n\nThe four categories of test\n\nThe conformance programme is not a single event. It is four distinct activities, applied at different points in a product's life:\n\nType tests — When it happens: once per product design. What it covers: full behavioural programme against the requirements standard. Where it runs: laboratory, on a conformance bench.\n\nProduction tests — When it happens: every unit shipped. What it covers: abbreviated checks on abnormal voltage and frequency response, plus documentation. Where it runs: factory, end of line.\n\nCommissioning tests and evaluations — When it happens: per installation. What it covers: verification that the installed system behaves correctly at its point of connection. Where it runs: site.\n\nPeriodic tests — When it happens: at intervals over service life. What it covers: confirmation that protective behaviour has not drifted. Where it runs: site.\n\nType tests are by far the largest and most demanding of the four, and they are the category a grid emulator exists to serve. Everything that follows in this guide concerns them.\n\nHow conformance becomes certification\n\nThe requirements standard issues no mark and no certificate. It becomes binding only when a jurisdiction adopts it — a public utility commission, a network operator, or a regional authority writing it into interconnection rules. Conformance is then typically demonstrated through a product certification scheme operated by an accredited testing laboratory, which uses the conformance test procedures as its technical basis. The certificate attests that a specific configuration — particular ratings, particular firmware, particular settings — was tested against those procedures and passed.\n\nThat qualifier matters more than manufacturers usually expect. Change the firmware, change a protective function, change a rating, and the scope of the certificate may no longer cover the product being shipped. This is one of the strongest arguments for owning a conformance-capable bench in-house rather than treating certification as a one-time external purchase.\n\nGrid Code Compliance Beyond North America\n\nThe conformance test procedures standard is a North American instrument, but the engineering it describes is not regionally specific. Comparable obligations exist in every major market, and they converge on the same functional families — ride-through, grid support, anti-islanding, power quality — while differing in thresholds, category structures, and how compliance is verified.\n\nNorth America — Governing framework: requirements standard plus its conformance test procedures companion. Verification approach: single prescriptive test-procedure document feeding a laboratory certification.\n\nEuropean Union — Governing framework: harmonised network code for generators, implemented through European connection standards for low- and medium-voltage generating plant. Verification approach: framework mandates that compliance be verified but leaves procedures largely to member states.\n\nGermany — Governing framework: national application rules for low, medium, and high voltage connection. Verification approach: certificate-based scheme with separate national test and modelling guidelines.\n\nUnited Kingdom — Governing framework: engineering recommendations for small and larger generating units. Verification approach: type-test evidence assessed against the recommendation.\n\nAustralia / New Zealand — Governing framework: national inverter requirements standard, region-based setpoints. Verification approach: approved-inverter listing maintained by the market body.\n\nThe practical consequence for a manufacturer selling into more than one market is significant. The physics of the tests is common: a source that can sag, swell, ramp frequency, step phase angle, unbalance phases, and absorb exported power will serve every one of these regimes. What changes between them is the parameter set. This is precisely why a parameterisable bench is worth more than a bench hard-coded to a single code — and why we design the CHP Series test application around loadable profiles rather than fixed sequences.\n\nWhat a Grid Code Compliance Bench Has to Do\n\nStrip away the specifics and a conformance bench performs four functions:\n\nDrive the terminal. Produce a controlled alternating-current condition at the equipment's grid connection — voltage, frequency, phase angle, and balance, each independently commandable.\n\nSupply the input. Provide the direct-current source that the equipment under test converts.\n\nMeasure the response. Capture terminal voltage and output current with the bandwidth and accuracy the procedures require.\n\nExecute the procedure. Sequence the run, hold each condition for its required dwell, repeat it across settings, and retain the record.\n\nThese four functions are the same on any bench anywhere in the world. What differs is how many separate instruments are needed to deliver them. The CHP Series performs all four from a single cabinet, with the companion Grid Emulator application compiling the procedure, executing the sequence, and retaining the results.\n\nCapabilities the type tests demand of the source\n\nReading the type-test programme as a specification for the bench rather than for the product under test yields a clear list of requirements:\n\nRegenerative, bidirectional power flow. The equipment under test exports. The source must absorb that power continuously, not dissipate it, and must maintain the commanded condition while doing so.\n\nIndependent per-phase control. Several tests require one phase to be driven while others are held, or phases to be driven in pairs. A source that can only move all three together cannot execute them.\n\nPhase-angle stepping. Angle-change ride-through requires genuine, abrupt angle displacement, on one phase and on all three, repeatable at arbitrary points on the wave.\n\nStep fidelity. A large number of procedures specify a step, not a ramp, precisely because a ramp makes the instant of crossing a matter of interpretation — and the measured clearing time with it.\n\nLow output distortion. Current distortion tests measure the equipment's contribution. A source that injects its own distortion contaminates the result.\n\nAdequate stiffness relative to the device rating. Whether a swell level can be held steady while the equipment under test reacts is a property of the source impedance relative to the device rating. This must be stated before coverage is claimed.\n\nMeasurement accuracy within the required class. The criteria are accuracy-bounded. A measurement path that cannot resolve the criterion cannot evidence it.\n\nA note on published thresholds\n\nThroughout this guide we describe what each test applies and what it measures, but we do not print trip levels, durations, or characteristic coordinates. Those values belong to the standard and are the property of its publisher. In our own test application they are not hard-coded either — they are loaded from a licensed copy of the standard before testing begins. We regard that as the correct engineering practice as well as the correct legal one: a bench that ships with baked-in thresholds is a bench that silently goes out of date the moment an amendment is published.\n\nThe Full Type-Test Programme: 28 Scenarios in Detail\n\nThe type-test programme divides naturally into five families. Every scenario below has the same underlying form: the terminal or the input is driven to a defined condition and held, and the response of the equipment under test is measured against a stated criterion.\n\nFamily 1 — Reactive Power and Voltage Control (Clause 5.14)\n\nThese seven tests command the equipment to hold a characteristic while the bench varies the terminal condition and the equipment's own output. They are the grid-support functions — the behaviour that distinguishes a modern resource from a passive one.\n\n1. Constant Power Factor Mode (5.14.3)\n\nVerifies that a commanded power factor is held while active power and terminal voltage are varied across the continuous operating region.\n\nApplied: Available active power is ramped down to minimum and back to rated. The terminal voltage is then stepped low, high, low, and back to nominal, and on through each imbalanced case.\n\nMeasured: Time-domain voltage and current are recorded after every change, from which active, apparent and reactive power and power factor are derived.\n\nCriterion: Reactive power holds the commanded proportion to active power, settles within the required time after each step, and does not follow the voltage steps.\n\nBench note: Active power moves only twice in a run. What is stepped repeatedly is the terminal voltage, and the whole sequence repeats at the other power factor settings — a structure that makes automation essential rather than optional.\n\n2. Voltage–Reactive Power (Volt-Var) Mode (5.14.4–5)\n\nVerifies that reactive power follows the voltage–reactive power characteristic as terminal voltage is stepped either side of each breakpoint.\n\nApplied: Terminal voltage is stepped in a staircase either side of the reference voltage, past each breakpoint of the characteristic and back.\n\nMeasured: Reactive power is recorded to a new steady state after every step, along with terminal voltage, current, and derived active power.\n\nCriterion: Steady-state reactive power lies on the characteristic for the measured voltage, and the approach to it meets the open-loop response requirement.\n\nBench note: The sequence is then repeated with an autonomously adjusting reference voltage, which returns reactive power toward zero as the reference tracks the terminal. Both variants must be run.\n\n3. Volt-Var Mode, Imbalanced Grid (5.14.6)\n\nVerifies volt-var operation when the phase voltages are imbalanced, so that a negative-sequence component is present at the terminal.\n\nApplied: Phase voltages are stepped to an imbalanced case in which one phase rises while the remainder fall, returned to nominal, then driven to the opposite case.\n\nMeasured: Reactive power and voltage are recorded to a new steady state after each step, and the run is repeated for each unbalance-response setting.\n\nCriterion: Steady-state reactive power lies on the characteristic for the applicable voltage, and the approach to it meets the response requirement.\n\nBench note: Where the equipment responds to the applicable voltage as a whole rather than per phase, reactive power can legitimately move in the opposite direction to the phase that rises. This is correct behaviour, not a failure — a distinction that has caught out more than one campaign.\n\n4. Active Power–Reactive Power (Watt-Var) Mode (5.14.7)\n\nVerifies that reactive power follows the active power–reactive power characteristic as available active power is varied over its range.\n\nApplied: Available active power is ramped up and down in a staircase either side of each breakpoint, and again in the region where the equipment absorbs power.\n\nMeasured: Reactive power is recorded to a new steady state after every change, together with active power, apparent power, and power factor.\n\nCriterion: Steady-state reactive power lies on the characteristic for the measured active power, and the approach to it meets the response requirement.\n\nBench note: Here active power is ramped, at the maximum rate stated by the manufacturer, whereas terminal voltage in the neighbouring tests is stepped. The distinction is deliberate and must be honoured by the sequencer.\n\n5. Constant Reactive Power (Var) Mode (5.14.8)\n\nVerifies that a commanded reactive power is held while active power is reduced and terminal voltage is stepped.\n\nApplied: Constant reactive power mode is enabled and a value commanded. Active power is stepped down twice and returned to rated. Terminal voltage is then stepped across the continuous operating region, the imbalanced cases are applied, and the mode is disabled.\n\nMeasured: After every change, time-domain voltage and current are recorded, and active, apparent and reactive power and power factor derived.\n\nCriterion: After each step a new steady-state reactive power is measured, reached within the required response time and within the stated test result accuracy.\n\nBench note: The command here is absolute, so unlike constant power factor mode the reactive output does not track active power. Disabling the mode at the end of the run is part of the test, not housekeeping.\n\n6. Voltage–Active Power (Volt-Watt) Mode (5.14.9)\n\nVerifies that active power is limited along the voltage–active power characteristic as terminal voltage is stepped toward the upper limit.\n\nApplied: Terminal voltage is stepped in a staircase either side of each breakpoint, up toward the top of the continuous operating region and back. The run repeats for each characteristic.\n\nMeasured: Active power is recorded to a new steady state after every step, with time-domain voltage and current, and apparent and reactive power and power factor derived.\n\nCriterion: Steady-state active power lies on the characteristic for the measured voltage, and the approach to it meets the response requirement.\n\nBench note: Curtailment follows the characteristic rather than a trip. The equipment stays connected throughout, and active power is expected to be restored on the return.\n\n7. Volt-Watt Mode, Imbalanced Grid (5.14.10)\n\nVerifies volt-watt operation when the phase voltages are imbalanced, so that a negative-sequence component is present at the terminal.\n\nApplied: Phase voltages are stepped to an imbalanced case in which one phase rises while the remainder fall, returned to nominal, then driven to the opposite case.\n\nMeasured: Active power and voltage are recorded to a new steady state after each step, and the run is repeated for each unbalance-response setting.\n\nCriterion: Steady-state active power lies on the characteristic for the applicable voltage, and the approach to it meets the response requirement.\n\nBench note: Only the default characteristic is applied here. What the run evaluates is the response to imbalance, not the shape of the characteristic itself — which was already established in the balanced test above.\n\nFamily 2 — Voltage Trip and Ride-Through (Clause 5.4)\n\nThese six tests drive the terminal outside the normal band, briefly or for a defined dwell, and establish whether the equipment rides through or clears. This family is where certification campaigns most often come unstuck.\n\n8. Overvoltage and Undervoltage Trip (5.4.2–3)\n\nEstablishes the voltage at which the equipment ceases to energize and the elapsed time to cessation.\n\nApplied: The bench holds the terminal just short of the trip condition for longer than the trip time setting, then steps it past in a single movement and holds it there.\n\nMeasured: The interval between the step and the instant the equipment stops energizing, and the voltage at which it trips. The run repeats above and below nominal, on each phase, at both setting extremes.\n\nCriterion: The equipment ceases to energize within the clearing time for that trip region, and its adjustable ranges of trip magnitude and duration cover those the standard allows.\n\nBench note: The disturbance is applied as a step and not as a ramp. Ramped, the moment of crossing becomes a matter of interpretation, and the measured interval with it.\n\n9. Low-Voltage Ride-Through (5.4.4)\n\nEstablishes that the equipment rides through a sequence of voltage sags without tripping, in each required operating region.\n\nApplied: Sag conditions are applied in sequence without interruption, each held for a minimum duration. Every transition is a step, including the recovery.\n\nMeasured: Terminal voltage and output current are recorded throughout. The sequence is repeated with the phases driven together, in pairs, and individually.\n\nCriterion: The equipment does not trip. In the mandatory operation region, apparent current holds above the required fraction of its pre-disturbance value; in the permissive region it may cease and restore instead.\n\nBench note: Undervoltage trip settings are disabled for this test. A cessation observed here is therefore ride-through behaviour, not a trip — and misreading it as a failure is a common early-campaign error.\n\n10. Consecutive Low-Voltage Ride-Through (5.4.4.3)\n\nEstablishes that the equipment sustains the sag sequences when they are repeated without interruption.\n\nApplied: The sag sequence is repeated back to back with no recovery interval. The closing condition is held at the low edge of the continuous operating region.\n\nMeasured: Output current across the whole run, including the interval from cessation of output to restored output.\n\nCriterion: The equipment does not trip on any repetition, and restores output within the required interval once voltage returns to the continuous region.\n\nBench note: The consecutive test runs at the same output power levels as the individual sequences, so results are directly comparable against them.\n\n11. Voltage Unbalance, Continuous Region (5.4.5)\n\nEstablishes that multiphase equipment continues operating and delivering power while its phase voltages are unbalanced inside the continuous region.\n\nApplied: The equipment is operated at rated active power under nominal conditions, then an unbalance is stepped onto the phase voltages — one high, one low, one at nominal — and held.\n\nMeasured: Active power throughout the hold. The procedure repeats for each unbalance condition defined.\n\nCriterion: Operation continues and active power is held at or above the pre-disturbance level, prorated by the least phase voltage. A brief deviation at the step itself is permitted.\n\nBench note: This is an operating test, not a ride-through test. The applicable voltage never leaves the continuous region, so there is no ride-through allowance to fall back on.\n\n12. High-Voltage Ride-Through (5.4.7)\n\nEstablishes that the equipment rides through a descending sequence of voltage swells without tripping.\n\nApplied: Swell conditions are stepped on and then stepped down in descending magnitude, each held longer than the condition above it.\n\nMeasured: Terminal voltage and output current. The voltage–reactive power mode is left enabled at its default setting for the duration.\n\nCriterion: The equipment rides through and does not trip. Where output ceases, it is restored within the required interval.\n\nBench note: Whether the swell level can be held steady during the disturbance depends on the stiffness of the source relative to the rating of the equipment under test. This is a bench property that has to be established and stated before the result means anything.\n\n13. Consecutive High-Voltage Ride-Through (5.4.7.4)\n\nEstablishes that the equipment sustains the swell sequences when repeated without interruption.\n\nApplied: The swell sequence is repeated without interruption, with the closing condition held at the high edge of the continuous region.\n\nMeasured: Output current, together with the interval from cessation of output to restored output after each swell.\n\nCriterion: The equipment rides through without tripping, and where output ceases it is restored within the required interval after each swell.\n\nBench note: As with the low-voltage case, overvoltage trip settings are disabled, so any cessation observed is ride-through behaviour rather than a trip.\n\nFamily 3 — Frequency Trip and Ride-Through (Clauses 5.5 and 5.15)\n\nThese seven tests follow the same form as the voltage family but are harder to drive, because frequency is a property of the source itself rather than of its amplitude. A bench that manipulates amplitude convincingly may still be unable to produce a clean, controlled frequency ramp under load.\n\n14. Overfrequency Trip (5.5.1)\n\nEstablishes the frequency at which the equipment ceases to energize, and the elapsed time to cessation, for each overfrequency region.\n\nApplied: Frequency is ramped to a hold short of the trip condition, then carried past it on a gentler ramp and held.\n\nMeasured: Output current, the frequency at cessation, and the interval from crossing to cessation. The run repeats at the setting extremes.\n\nCriterion: The equipment ceases to energize within the clearing time required for the applicable overfrequency region.\n\nBench note: The approach ramp is driven at or above the ride-through rate limit, while the ramp past the trip condition is deliberately kept below it — so the equipment cannot pass by riding through the approach.\n\n15. Underfrequency Trip (5.5.2)\n\nEstablishes the frequency at which the equipment ceases to energize, and the elapsed time to cessation, for each underfrequency region.\n\nApplied: Frequency is ramped to a hold short of the trip condition, then carried past it on a gentler ramp and held.\n\nMeasured: Output current, the frequency at cessation, and the interval from crossing to cessation. The run repeats at the setting extremes.\n\nCriterion: The equipment ceases to energize within the clearing time required for the applicable underfrequency region.\n\nBench note: The frequency-droop function is widened beforehand, so that a legitimate change of active power with falling frequency is not mistaken for cessation of output.\n\n16. Low-Frequency Ride-Through (5.5.3)\n\nEstablishes that the equipment stays in operation through a sustained low-frequency excursion below the continuous operating region.\n\nApplied: Frequency is ramped down from nominal to a level below the continuous operating region, held there, then ramped back to nominal. The excursion is repeated.\n\nMeasured: Output current at the terminal, referenced to the value recorded at nominal frequency before the excursion.\n\nCriterion: The equipment rides through the excursion, neither tripping nor ceasing to energize, for the whole of the hold.\n\nBench note: The transition rate is deliberately at or above the ride-through limit. The ramp is part of the test, not merely a way of reaching the hold.\n\n17. High-Frequency Ride-Through (5.5.4)\n\nEstablishes that the equipment stays in operation through a sustained high-frequency excursion above the continuous operating region.\n\nApplied: Frequency is ramped up from nominal to a level above the continuous operating region, held there, then ramped back. The excursion is repeated.\n\nMeasured: Output current at the terminal, referenced to the value recorded at nominal frequency before the excursion.\n\nCriterion: The equipment rides through the excursion, neither tripping nor ceasing to energize, for the whole of the hold.\n\nBench note: The equipment under test includes its prime mover or energy source, whose limits can govern ride-through capability rather than the controls. Testing the converter in isolation can produce a pass that the complete resource will not reproduce.\n\n18. Rate of Change of Frequency, ROCOF (5.5.5)\n\nEstablishes the rate of change of frequency the equipment withstands, evaluated from the transitions of the frequency ride-through tests.\n\nApplied: No separate excursion. A frequency ride-through run is reused, with its transitions driven at or above the required rate limit.\n\nMeasured: The applied transition rate and the output current through it, taken from the records of the low- and high-frequency ride-through runs.\n\nCriterion: The equipment stays in operation through transitions at or above the rate required for its abnormal operating performance category.\n\nBench note: Because conformance is drawn from existing ride-through records, the transition rate has to be set correctly there. Get it wrong and this test cannot be recovered without re-running the ride-through sequences.\n\n19. Voltage Phase-Angle Change Ride-Through (5.5.6)\n\nEstablishes that the equipment rides through sudden changes in the voltage phase angle at its terminal without tripping.\n\nApplied: The angle of the phase under test is stepped, held, then returned, with the other phases held steady. Further cases shift all three together. Each sequence is repeated at a random point on wave.\n\nMeasured: Output current through each jump, and its restoration after any momentary cessation, referenced to the pre-disturbance value.\n\nCriterion: The equipment does not trip. Where output momentarily ceases, current is restored to the required fraction of its pre-disturbance value.\n\nBench note: Phase-to-phase voltage moves with the angle, so the source magnitude has to be adjusted to keep voltage tripping from confounding the result. This is one of the most demanding tests to drive correctly, and one of the clearest separators between a genuine grid emulator and a programmable supply.\n\n20. Frequency-Droop Response (5.15.2–3)\n\nEstablishes that active power follows the frequency-droop characteristic above and below nominal, with deadband and response time observed.\n\nApplied: Frequency is ramped — never stepped — out of the deadband to each end of the continuous operating region and back, above and below nominal.\n\nMeasured: Active power at each settled frequency and the settling time after each ramp. The sequence repeats for each declared characteristic.\n\nCriterion: Settled active power lies on the declared characteristic within the stated accuracy, and settling occurs within the declared response time.\n\nBench note: The starting output is not the same above and below nominal, since only the run below nominal requires headroom for active power to rise. Setting up both runs identically is a straightforward way to fail this test.\n\nFamily 4 — Service, Synchronization and Control (Clauses 5.6, 5.7, 5.13 and 5.16)\n\nThese four tests concern connection, disconnection, and command authority. The criteria here are timing and ramp rate rather than a level, which changes what the bench has to resolve.\n\n21. Enter Service (5.6)\n\nEstablishes that export is withheld until the enter service criteria are satisfied and the delay has elapsed.\n\nApplied: Permit service is disabled, the criteria are set, and the terminal is held outside the window. Frequency is displaced instead of voltage in companion cases.\n\nMeasured: Active power. The span from the last re-entry into the window to the first export is taken, together with the rise toward rated output.\n\nCriterion: No export precedes the delay, the rise stays within the permitted ramp, and output ceases when permit service is withdrawn.\n\nBench note: The brief excursion back outside the window is deliberate — it restarts the delay counter, and the recorded span begins from that re-entry. A sequencer that treats it as noise will measure the wrong interval.\n\n22. Synchronization (5.7)\n\nEstablishes that closure is permitted only while the voltage, frequency and phase-angle differences all lie inside the allowable window.\n\nApplied: The bench is held at nominal while the device side is offset beyond the allowable window, held there, then ramped toward it.\n\nMeasured: The close command is monitored, and the voltage, frequency and phase-angle differences are recorded at the instant closure is initiated.\n\nCriterion: Closure is initiated only once every difference lies inside the allowable window, and never while any lies outside it.\n\nBench note: The approach is ramped rather than stepped so that the instant of closure resolves cleanly. The run repeats from the opposite direction, and again in frequency.\n\n23. Limit Active Power (5.13)\n\nEstablishes that active power is held to a commanded limit, and that voltage and frequency response take precedence over that limit.\n\nApplied: An active power limit is commanded at rated output. The bench frequency is then stepped low and high, and voltage stepped high, each excursion held.\n\nMeasured: Active power throughout, with a steady-state value taken in each hold and in each return to nominal.\n\nCriterion: Output settles at the commanded limit and departs from it only as the droop and volt-watt characteristics require.\n\nBench note: Each excursion is held until output settles. Both the settled value and the time taken to reach it are evaluated, and the whole sequence repeats at further limits.\n\n24. Voltage and Frequency Regulation Priority (5.16.1)\n\nEstablishes that voltage and frequency regulation functions operating simultaneously are resolved by the equipment in the required order.\n\nApplied: Volt-watt, frequency-droop and a reactive mode are enabled together under a commanded limit. Paired voltage and frequency set-points are then applied.\n\nMeasured: Active and reactive power, with a steady-state value taken after each set-point. The sequence repeats with each reactive mode in turn.\n\nCriterion: Each settled point matches the response the enabled functions jointly require, so that the commanded limit yields where regulation has priority.\n\nBench note: Response time is not evaluated in this test, so transitions may be made at any convenient rate — but each point must be taken only after the slowest enabled function has settled.\n\nFamily 5 — Power Quality and Measurement (Clauses 5.9, 5.11, 5.12 and 5.17)\n\nThese four tests depend on the measurement path and the purity of the source output rather than on raw power capability. Coverage claims in this family are qualified, and honestly stating those qualifications is part of good practice.\n\n25. Limitation of DC Injection for Inverters (5.9)\n\nEstablishes that the direct-current component of current delivered by the equipment stays within the permitted limit during steady rated operation.\n\nApplied: Nominal conditions are held undisturbed while the equipment operates at its continuous rated output current at unity power factor.\n\nMeasured: RMS voltage, RMS current, and the direct-current component of current, recorded on every phase for the duration of the run.\n\nCriterion: The averaged direct-current component magnitude of each phase, taken against rated output current, stays within the limit set in the requirements standard.\n\nBench note: The test is waived where a direct-current-isolating line-frequency output transformer is present or is required by the installation instructions.\n\n26. Open Phase (5.11)\n\nEstablishes that the equipment ceases to energize the area network upon loss of an individual phase at the point of connection.\n\nApplied: Nominal conditions are established, then a phase conductor disconnect is opened while the equipment carries low output current.\n\nMeasured: The clearing time from the opening of the disconnect until the equipment ceases to energize every terminal fed by the source.\n\nCriterion: Cessation falls within the required interval on every repeat, and for each phase in turn.\n\nBench note: Opening a phase ahead of an intervening transformer can excite ferroresonance. A small resistive load is advisable to prevent it — a practical detail that is easy to overlook until it damages something.\n\n27. Current Distortion (5.12)\n\nEstablishes the harmonic, inter-harmonic and total rated-current distortion the equipment produces under balanced steady conditions.\n\nApplied: A low-distortion source output is held at nominal voltage and frequency while the equipment is taken through the defined operating conditions.\n\nMeasured: The current of each phase in steady state, resolved into harmonic, inter-harmonic and total rated-current distortion.\n\nCriterion: Every recorded component, and the total rated-current distortion, stay within the limits of the requirements standard on each phase and at each condition.\n\nBench note: Distortion arising from voltage distortion at the terminal is excluded from the result. Where a measurement exceeds the limit, the source is verified against a load bank alone before the equipment is judged — a step that regularly exonerates the device under test.\n\n28. Limitation of Overvoltage Contribution (5.17)\n\nEstablishes the overvoltage the equipment contributes when a switching action creates a generation-load island.\n\nApplied: Nominal conditions are set with the equipment supplying a resistive load, then the source is separated — the load rejection sequence. A ground fault sequence is also defined.\n\nMeasured: Voltage across the load, recorded from separation until the equipment ceases to energize it.\n\nCriterion: Cumulative duration above each threshold stays inside the voltage-duration characteristic of the requirements standard, down to the unloaded case.\n\nBench note: The sequence is repeated with separation taken at differing points of the line cycle, because the resulting overvoltage depends strongly on that instant. A single separation event proves very little.\n\nUnintentional Islanding: The Test That Sits Apart\n\nThe twenty-eight scenarios above are the tests a grid emulator drives directly. Unintentional islanding testing sits in a different category, and it is worth being explicit about why.\n\nThe requirement is straightforward to state: when the equipment finds itself supplying an island, it must detect that condition and cease to energize within the required interval, whatever the local balance of generation and load. The difficulty is that the hardest case is the one where local load almost exactly matches the equipment's output — the non-detection zone — because in that condition there is almost no frequency or voltage error for a detection algorithm to find.\n\nThe procedure specifies a resonant parallel load tuned to a specified quality factor, which suppresses precisely the perturbations that active detection methods rely on. Physically, this means a tuned resistive-inductive-capacitive load bank, retuned for each device rating, generating significant heat and occupying significant floor space. Results are inherently less repeatable than in the rest of the programme, because an islanded system is unstable by construction.\n\nThis is the test where hardware-in-the-loop methods earn their place, and the standard anticipates it.\n\nHardware-in-the-Loop and Power-HIL in Conformance Testing\n\nThe conformance test procedures standard includes an informative annex on hardware-in-the-loop-based testing. It addresses controller hardware-in-the-loop testing for supplemental devices, additional Power-HIL setup requirements specifically for testing unintentional islanding, and the measurement of impedance characteristics.\n\nThat the standard treats these methods explicitly matters. It means Power-HIL is not a workaround applied in place of proper conformance testing; it is a recognised approach within the conformance framework itself.\n\nThe engineering case is strongest for the islanding test. A virtual load, computed in real time and imposed through a power interface, can be retuned in software rather than rebuilt in hardware, swept finely through the non-detection zone rather than sampled at a handful of physical tuning points, and repeated identically as many times as needed. It does not heat the laboratory and it does not need a new build for the next device rating.\n\nThe corresponding challenge is the interface. Power-HIL couples a real-time model to real power through an amplifier, and the fidelity of the result depends on the bandwidth and latency of that coupling. Interface latency does not merely blur the result — it can destabilise the loop outright. This is why we build our Power-HIL platforms on FPGA-based real-time simulation: the model timestep and the interface latency are the specification, not an afterthought.\n\nThe broader value of hardware-in-the-loop in a compliance programme is pre-compliance. A model of the network, driven against real hardware, lets a manufacturer discover that a ride-through profile fails in week six of development rather than in week two of a booked laboratory campaign. That is where the economics of the whole exercise are decided.\n\nWhy Grid Code Compliance Campaigns Fail\n\nAcross the programme, failures cluster in a small number of places:\n\nRide-through behaviour under combined stress. Equipment that rides through a clean sag often fails a consecutive sequence, or fails when the sag is applied to a single phase rather than all three.\n\nSettling and response times. The characteristic is met, but not within the declared response time — or the declared response time was optimistic in the datasheet and nobody re-checked it.\n\nPriority conflicts. Functions that behave correctly in isolation resolve in the wrong order when enabled together.\n\nSetting ranges. The equipment meets the trip requirement at its default setting but its adjustable range does not span what the standard requires.\n\nBench limitations misread as device failures. A source too soft for the device rating cannot hold a swell; a measurement path outside the required accuracy class cannot evidence a criterion. Both produce results that look like device failures and are not.\n\nConfiguration drift. Firmware changes after testing, and the certified configuration no longer matches the shipped one.\n\nEvery item on that list is discoverable in-house, before a laboratory campaign begins, on a bench that can execute the same procedures. That is the entire argument for pre-compliance capability, and it is why we built the CHP Series and the Grid Emulator application to run the type-test catalogue rather than a subset of it.\n\nBuilding a Grid Code Compliance Bench with Impedyme\n\nThe CHP Series brings the four bench functions into a single cabinet: a regenerative source that drives voltage and frequency with independent per-phase control and true bidirectional power flow; a direct-current supply for the equipment input; a measurement path matched to the accuracy the criteria demand; and the application that compiles the procedure, executes the sequence, and retains the record.\n\nThe companion Grid Emulator application carries the same test catalogue described in this guide. Each test is presented as a tile stating the clause, the quantity driven at the terminal, and a thumbnail of the profile — and because the thumbnail is drawn from the same segments the run engine plays, a tile cannot diverge from the test it represents. Each run is retained with its settings, so a result can be reproduced or compared months later, which is exactly what an auditor, a certification body, or a returning engineer will ask for.\n\nCommanded condition and returned trace are drawn on one frame against one time axis, voltage on one scale and frequency on the other, so that any lag between what was asked for and what the bench delivered is seen rather than inferred. For a family of tests whose criteria are timing criteria, that distinction is not cosmetic.\n\nBecause levels and durations are loaded from a licensed copy of the standard rather than compiled into the product, the same bench serves the North American programme and the European, British, and Australian regimes — the profile changes, the hardware does not.\n\nFrequently Asked Questions\n\nWhat is the difference between IEEE 1547 and IEEE 1547.1?\nIEEE Std 1547 states the interconnection and interoperability requirements a distributed energy resource must meet — the “what.” IEEE Std 1547.1 specifies the type, production, commissioning, and periodic test procedures used to confirm that equipment conforms to those requirements — the “how.” One defines the obligation; the other defines how it is demonstrated.\n\nIs grid code compliance mandatory?\nThe technical standards themselves are voluntary documents. They become mandatory when a jurisdiction adopts them into its interconnection rules — typically a public utility commission, a network operator, or a regional regulator. In practice, in most developed markets, equipment that cannot evidence conformance cannot obtain permission to operate.\n\nWhat equipment is needed for IEEE 1547.1 type testing?\nAt minimum: a regenerative alternating-current source capable of independent per-phase voltage, frequency and phase-angle control; a direct-current supply for the equipment input; a measurement path within the required accuracy class; and a sequencer capable of executing and recording the procedures. These can be assembled from separate instruments or delivered from a single cabinet.\n\nCan Power Hardware-in-the-Loop be used for conformance testing?\nYes, within the framework the standard sets out. The conformance test procedures standard contains an informative annex addressing hardware-in-the-loop-based testing, including controller hardware-in-the-loop for supplemental devices and Power-HIL setup requirements for unintentional islanding testing. Power-HIL is also widely used for pre-compliance work ahead of a formal campaign.\n\nHow long does a grid code compliance campaign take?\nIt varies widely with product readiness and laboratory availability. The type-test programme alone runs to thousands of individual measurement points once every test is repeated across settings, power levels, phase combinations and setting extremes, so manual execution is measured in weeks to months. Automation of the sequence is the single largest lever on that timeline.\n\nWhy does the same test get repeated so many times?\nBecause a single pass proves very little. Most procedures repeat across setting extremes, across phases individually and in combination, at multiple power levels, and — for tests where the point on wave matters — at randomised switching instants. The repetition is what converts a favourable result into evidence.\n\nWhat is the non-detection zone in anti-islanding testing?\nIt is the region in which local load closely matches the resource's own output, so that separating from the network produces almost no change in voltage or frequency. With nothing to detect, an islanding detection algorithm has very little to work with, which is exactly why the test targets that condition deliberately.\n\nDo European, UK and Australian grid codes require different test equipment?\nGenerally no. The functional families are common across modern grid codes — ride-through, grid support, anti-islanding, power quality — so a source that can sag, swell, ramp frequency, step phase angle, unbalance phases and absorb exported power will serve all of them. What differs between regimes is the parameter set, not the hardware capability.\n\nCan we do compliance testing in-house, or must it go to an external laboratory?\nFormal certification is normally issued by an accredited body. In-house testing serves a different and equally important purpose: pre-compliance. Finding a ride-through or settling-time failure on your own bench costs engineering time. Finding it during a booked external campaign costs the campaign.","articleSection":"Grid Code Compliance","wordCount":6970,"timeRequired":"PT31M","inLanguage":"en","isAccessibleForFree":true,"isPartOf":{"@id":"https://impedyme.com/resource-center/ieee-1547-grid-code-compliance-testing/#webpage"},"mainEntityOfPage":{"@id":"https://impedyme.com/resource-center/ieee-1547-grid-code-compliance-testing/#webpage"},"url":"https://impedyme.com/resource-center/ieee-1547-grid-code-compliance-testing/","datePublished":"2026-08-23T09:00:00-04:00","dateModified":"2026-08-23T09:00:00-04:00","author":{"@id":"https://impedyme.com/#organization"},"creator":{"@id":"https://impedyme.com/#organization"},"publisher":{"@id":"https://impedyme.com/#organization"},"copyrightHolder":{"@id":"https://impedyme.com/#organization"},"copyrightYear":2026,"audience":[{"@id":"https://impedyme.com/#audience-rts"},{"@id":"https://impedyme.com/#audience-ieee1547"}],"image":[{"@id":"https://impedyme.com/resource-center/ieee-1547-grid-code-compliance-testing/#ieee-1547-grid-code-compliance-testing-chp-series-16x9"},{"@id":"https://impedyme.com/resource-center/ieee-1547-grid-code-compliance-testing/#ieee-1547-grid-code-compliance-testing-chp-series-4x3"},{"@id":"https://impedyme.com/resource-center/ieee-1547-grid-code-compliance-testing/#ieee-1547-grid-code-compli
