name: Keep Alive

on:
  schedule:
    - cron: '0 8 1 * *'  # 1st of every month at 8:00 AM UTC

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update keepalive timestamp
        run: |
          echo "Last keepalive: $(date -u '+%Y-%m-%d %H:%M UTC')" > last-keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-keepalive.txt
          git commit -m "chore: keepalive $(date -u '+%Y-%m')"
          git push
