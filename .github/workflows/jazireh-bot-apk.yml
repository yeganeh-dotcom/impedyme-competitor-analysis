name: Jazireh Bot – build APK

on:
  push:
    paths:
      - 'jazireh-bot/**'
      - '.github/workflows/jazireh-bot-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jazireh-bot-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: jazireh-bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk jazireh-bot.apk
          ls -la jazireh-bot.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jazireh-bot-apk
          path: jazireh-bot/jazireh-bot.apk
          retention-days: 60

      - name: Publish APK as GitHub release "jazireh-bot-latest"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete jazireh-bot-latest --cleanup-tag --yes || true
          gh release create jazireh-bot-latest jazireh-bot.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Jazireh Bot – latest build" \
            --notes "Automated build from branch ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Download jazireh-bot.apk on the phone and install it."
