<style>
/* ===================== */
/* VARIABLES             */
/* ===================== */
.layout{
  --accent:#D18100;
  --accent-soft:rgba(209,129,0,.10);
  --accent-line:rgba(209,129,0,.30);
  --card-bg:#f5f5f5;
  --text-main:#1c1c1c;
  --text-body:#3d3d3d;
  --text-muted:#7a7a7a;
  --line:rgba(0,0,0,.09);
  --radius:16px;
}

/* Scope everything to .layout so header/footer are untouched */
.layout,
.layout *{
  box-sizing:border-box;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

.layout button{
  font:inherit;
  color:inherit;
  background:none;
  border:0;
  margin:0;
}

/* ===================== */
/* MAIN LAYOUT           */
/* ===================== */
.layout{
  max-width:1300px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr;
  gap:28px;
  padding:10px;
  color:var(--text-body);
}

/* ===================== */
/* HEADER                */
/* ===================== */
.layout-head{
  display:flex;
  flex-direction:column;
  gap:10px;
  max-width:940px;
}

.eyebrow{
  margin:0;
  font-size:13px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
}

.layout-title{
  margin:0;
  font-size:32px;
  font-weight:700;
  line-height:1.15;
  color:var(--text-main);
}

.layout-intro{
  margin:0;
  font-size:16px;
  line-height:1.7;
  color:var(--text-body);
  transition:opacity .25s ease;
}

.layout-intro.fade{opacity:0}

/* ===================== */
/* FAMILY FILTERS        */
/* ===================== */
.layout .filters{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.layout .filter{
  padding:9px 16px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--card-bg);
  font-size:14px;
  font-weight:600;
  color:var(--text-muted);
  cursor:pointer;
  transition:color .2s ease, border-color .2s ease, background .2s ease;
  white-space:nowrap;
}

.layout .filter:hover{
  color:var(--text-main);
  border-color:var(--accent-line);
}

.layout .filter.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}

.layout .filter .count{
  margin-left:6px;
  font-weight:500;
  opacity:.72;
}

.layout .filter:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* ===================== */
/* TOP CARDS             */
/* ===================== */
.left-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:16px;
}

/* CARD */
.layout .list-item{
  background:var(--card-bg);
  padding:16px;
  border-radius:var(--radius);
  display:flex;
  gap:14px;
  align-items:flex-start;
  text-align:left;
  width:100%;
  cursor:pointer;
  border:1px solid var(--line);
  transition:transform .25s ease, border-color .25s ease, background .25s ease;
  min-height:100px;
  box-shadow:none !important;
}

.layout .list-item:hover{
  transform:translateY(-4px);
  border-color:var(--accent-line);
}

.layout .list-item:active,
.layout .list-item:focus{
  box-shadow:none !important;
}

.layout .list-item:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

.layout .list-item.active{
  border-color:var(--accent);
  background:var(--accent-soft);
  box-shadow:none !important;
}

/* ICON TILE — swap the inline SVG for <img src="..."> to use your own art */
.icon{
  flex:0 0 auto;
  width:44px;
  height:44px;
  border-radius:12px;
  background:var(--accent);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.icon svg{
  width:24px;
  height:24px;
  display:block;
}

.icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.list-text{
  display:flex;
  flex-direction:column;
  gap:4px;
  min-width:0;
}

.list-index{
  font-size:12px;
  font-weight:600;
  letter-spacing:.08em;
  color:var(--text-muted);
}

.layout .list-item.active .list-index{color:var(--accent)}

.list-title{
  font-size:15px;
  font-weight:600;
  line-height:1.35;
  color:var(--text-main);
}

.list-clause{
  font-size:12px;
  color:var(--text-muted);
}

/* ===================== */
/* MAIN PANEL            */
/* ===================== */
.panel{
  background:var(--card-bg);
  padding:36px;
  border-radius:24px;
  border:1px solid var(--line);
  box-shadow:none !important;
  transition:opacity .3s ease, transform .3s ease;
}

.panel.fade{
  opacity:0;
  transform:translateY(14px);
}

.panel-header{
  display:flex;
  gap:20px;
  align-items:center;
}

.panel-icon{
  flex:0 0 auto;
  width:72px;
  height:72px;
  border-radius:18px;
  background:var(--accent);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.panel-icon svg{width:38px;height:38px;display:block}
.panel-icon img{width:100%;height:100%;object-fit:cover}

.panel-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}

.chip{
  font-size:12px;
  font-weight:600;
  padding:4px 10px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent);
  border:1px solid var(--accent-line);
}

.clause{
  font-size:12px;
  font-weight:600;
  letter-spacing:.04em;
  color:var(--text-muted);
}

.panel h3{
  margin:0;
  font-size:28px;
  font-weight:700;
  line-height:1.2;
  color:var(--accent);
}

.panel-lede{
  margin:20px 0 0;
  font-size:17px;
  line-height:1.65;
  color:var(--text-main);
}

.panel-grid{
  margin-top:24px;
  padding-top:24px;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:24px;
}

.spec-label{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
  font-size:11px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
}

.spec-label::before{
  content:"";
  width:18px;
  height:2px;
  border-radius:2px;
  background:var(--accent);
}

.spec-text{
  font-size:15px;
  line-height:1.7;
  color:var(--text-body);
}

.bench-note{
  margin-top:24px;
  padding:18px 20px;
  border-radius:12px;
  border-left:3px solid var(--accent);
  background:var(--accent-soft);
}

.bench-note .spec-label::before{display:none}

/* ===================== */
/* PANEL NAVIGATION      */
/* ===================== */
.panel-nav{
  margin-top:26px;
  padding-top:20px;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.layout .nav-btn{
  padding:9px 16px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  font-size:14px;
  font-weight:600;
  color:var(--text-main);
  cursor:pointer;
  transition:border-color .2s ease, color .2s ease;
}

.layout .nav-btn:hover:not(:disabled){
  border-color:var(--accent);
  color:var(--accent);
}

.layout .nav-btn:disabled{
  opacity:.4;
  cursor:default;
}

.layout .nav-btn:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

.counter{
  font-size:13px;
  font-weight:600;
  color:var(--text-muted);
}

/* ===================== */
/* MOBILE                */
/* ===================== */
@media(max-width:850px){

  .layout{gap:22px}

  .layout-title{font-size:26px}

  .left-list{
    display:flex;
    gap:14px;
    overflow-x:auto;
    margin:0 -10px;
    padding:2px 16px 12px;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
  }

  .layout .list-item{
    flex:0 0 auto;
    width:78vw;
    max-width:330px;
    scroll-snap-align:start;
  }

  .layout .list-item:hover{transform:none}

  .left-list::-webkit-scrollbar{height:4px}
  .left-list::-webkit-scrollbar-track{background:transparent}
  .left-list::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:4px}

  .panel{padding:24px}
  .panel h3{font-size:22px}
  .panel-lede{font-size:16px}
  .panel-header{gap:14px}

  .panel-icon{width:56px;height:56px;border-radius:14px}
  .panel-icon svg{width:30px;height:30px}

  .panel-grid{gap:20px}
  .layout .nav-btn{padding:8px 13px;font-size:13px}
}

@media(max-width:560px){
  /* keep the filter row compact — "Family 1" instead of the full name */
  .layout .filter .fname{display:none}
}
</style>

  /* =====================================================================
     RENDER
     ===================================================================== */
  var root = document.getElementById("impScenarios");
  if(!root) return;

  var q = function(sel){ return root.querySelector(sel); };

  var listEl    = q("[data-list]");
  var filtersEl = q("[data-filters]");
  var blurbEl   = q("[data-blurb]");
  var panel     = q("[data-panel]");
  var prevBtn   = q("[data-prev]");
  var nextBtn   = q("[data-next]");

  var panelEls = {
    icon:      q("[data-panel-icon]"),
    family:    q("[data-panel-family]"),
    clause:    q("[data-panel-clause]"),
    title:     q("[data-panel-title]"),
    lede:      q("[data-panel-lede]"),
    applied:   q("[data-panel-applied]"),
    measured:  q("[data-panel-measured]"),
    criterion: q("[data-panel-criterion]"),
    note:      q("[data-panel-note]"),
    counter:   q("[data-counter]")
  };

  var activeFamily = 0;   /* 0 = all families */
  var current = 0;        /* index into DATA */
  var visible = [];       /* indices of DATA currently shown */
  var fadeTimer = null;

  function familyById(id){
    for(var i=0;i<FAMILIES.length;i++){ if(FAMILIES[i].id === id) return FAMILIES[i]; }
    return null;
  }

  function pad(n){ return n < 10 ? "0" + n : "" + n; }

  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function countIn(id){
    var c = 0;
    for(var i=0;i<DATA.length;i++){ if(DATA[i].family === id) c++; }
    return c;
  }

  /* ---------- FILTERS ---------- */
  function buildFilters(){
    var html = '<button class="filter active" type="button" data-family="0">'
             + 'All scenarios<span class="count">' + DATA.length + '</span></button>';

    for(var i=0;i<FAMILIES.length;i++){
      var f = FAMILIES[i];
      html += '<button class="filter" type="button" data-family="' + f.id + '">'
            + esc(f.short) + '<span class="fname"> &middot; ' + esc(f.name) + '</span>'
            + '<span class="count">' + countIn(f.id) + '</span></button>';
    }
    filtersEl.innerHTML = html;

    var btns = filtersEl.querySelectorAll(".filter");
    for(var j=0;j<btns.length;j++){
      btns[j].addEventListener("click", function(){
        setFamily(parseInt(this.getAttribute("data-family"), 10));
      });
    }
  }

  function setFamily(id){
    activeFamily = id;

    var btns = filtersEl.querySelectorAll(".filter");
    for(var i=0;i<btns.length;i++){
      var on = parseInt(btns[i].getAttribute("data-family"), 10) === id;
      btns[i].classList.toggle("active", on);
      btns[i].setAttribute("aria-pressed", on ? "true" : "false");
    }

    var fam = familyById(id);
    blurbEl.classList.add("fade");
    window.setTimeout(function(){
      blurbEl.textContent = fam ? fam.blurb : INTRO;
      blurbEl.classList.remove("fade");
    }, 180);

    buildCards();

    /* keep the open scenario if it is still on screen, else open the first */
    if(visible.indexOf(current) === -1) select(visible[0], false);
    else markActive();
    updateNav();
  }

  /* ---------- CARDS ---------- */
  function buildCards(){
    visible = [];
    var html = "";

    for(var i=0;i<DATA.length;i++){
      var d = DATA[i];
      if(activeFamily !== 0 && d.family !== activeFamily) continue;
      visible.push(i);

      html += '<button class="list-item" type="button" role="tab" data-i="' + i + '"'
            + ' aria-selected="' + (i === current ? "true" : "false") + '">'
            +   '<span class="icon">' + (ICONS[d.icon] || ICONS.pf) + '</span>'
            +   '<span class="list-text">'
            +     '<span class="list-index">' + pad(i + 1) + '</span>'
            +     '<span class="list-title">' + esc(d.title) + '</span>'
            +     '<span class="list-clause">' + esc(d.clause) + '</span>'
            +   '</span>'
            + '</button>';
    }

    listEl.innerHTML = html;

    var cards = listEl.querySelectorAll(".list-item");
    for(var c=0;c<cards.length;c++){
      cards[c].addEventListener("click", function(){
        select(parseInt(this.getAttribute("data-i"), 10), false);
      });
      cards[c].addEventListener("keydown", onCardKey);
    }
    markActive();
  }

  function onCardKey(e){
    var key = e.key;
    if(key !== "ArrowRight" && key !== "ArrowLeft" && key !== "ArrowDown" && key !== "ArrowUp") return;
    e.preventDefault();
    step(key === "ArrowRight" || key === "ArrowDown" ? 1 : -1, true);
  }

  function markActive(){
    var cards = listEl.querySelectorAll(".list-item");
    for(var i=0;i<cards.length;i++){
      var on = parseInt(cards[i].getAttribute("data-i"), 10) === current;
      cards[i].classList.toggle("active", on);
      cards[i].setAttribute("aria-selected", on ? "true" : "false");
    }
  }

  function cardFor(i){ return listEl.querySelector('.list-item[data-i="' + i + '"]'); }

  /* ---------- PANEL ---------- */
  function select(i, focusCard){
    if(typeof i !== "number" || !DATA[i]) return;
    current = i;
    markActive();
    updateNav();

    var card = cardFor(i);
    if(card){
      if(card.scrollIntoView) card.scrollIntoView({block:"nearest", inline:"nearest", behavior:"smooth"});
      if(focusCard) card.focus();
    }

    var d = DATA[i];
    var fam = familyById(d.family);

    panel.classList.add("fade");
    window.clearTimeout(fadeTimer);
    fadeTimer = window.setTimeout(function(){
      panelEls.icon.innerHTML   = ICONS[d.icon] || ICONS.pf;
      panelEls.family.textContent = fam ? fam.short + " · " + fam.name : "";
      panelEls.clause.textContent = d.clause;
      panelEls.title.textContent  = pad(i + 1) + ". " + d.title;
      panelEls.lede.textContent      = d.lede;
      panelEls.applied.textContent   = d.applied;
      panelEls.measured.textContent  = d.measured;
      panelEls.criterion.textContent = d.criterion;
      panelEls.note.textContent      = d.note;
      panel.classList.remove("fade");
    }, 220);
  }

  function step(dir, focusCard){
    var at = visible.indexOf(current);
    var to = at + dir;
    if(to < 0 || to >= visible.length) return;
    select(visible[to], focusCard);
  }

  function updateNav(){
    var at = visible.indexOf(current);
    prevBtn.disabled = at <= 0;
    nextBtn.disabled = at === -1 || at >= visible.length - 1;
    panelEls.counter.textContent = (at + 1) + " / " + visible.length
      + (activeFamily === 0 ? "" : " in this family");
  }

  prevBtn.addEventListener("click", function(){ step(-1, false); });
  nextBtn.addEventListener("click", function(){ step(1, false); });

  /* ---------- INIT ---------- */
  blurbEl.textContent = INTRO;
  buildFilters();
  buildCards();
  select(0, false);

})();
</script>
