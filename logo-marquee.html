<!-- ============================================================
     Impedyme logo marquee — scrolls right → left, loops forever.
     Paste this whole block into a WordPress "Custom HTML" block
     (or Elementor HTML widget). Everything is scoped under
     .imp-marquee so it won't clash with your theme.

     To change logos: edit the <img> tags in the FIRST .imp-marquee__group.
     Then copy the same images into the SECOND group in the same order,
     with alt="" left empty (it's the seamless-loop duplicate).
     ============================================================ -->
<section class="imp-marquee" aria-label="Trusted by">
  <div class="imp-marquee__viewport">
  <div class="imp-marquee__track">
    <ul class="imp-marquee__group">
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/litens-logo.webp" alt="Litens" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/liebherr-logo.webp" alt="Liebherr" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/flex-logo.webp" alt="Flex" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/exowatt-logo.webp" alt="Exowatt" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/duke-energy-logo.webp" alt="Duke Energy" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/unbox-robotics-logo.webp" alt="Unbox Robotics" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/kema-labs-logo.webp" alt="KEMA Labs" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/nasa-logo.webp" alt="NASA" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/Lucid-logo.webp" alt="Lucid" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/jlg-logo.webp" alt="JLG" class="imp-logo--tight" loading="lazy"></li>
    </ul>
    <!-- Duplicate for a seamless loop (hidden from screen readers) -->
    <ul class="imp-marquee__group" aria-hidden="true">
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/litens-logo.webp" alt="" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/liebherr-logo.webp" alt="" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/flex-logo.webp" alt="" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/exowatt-logo.webp" alt="" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/duke-energy-logo.webp" alt="" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/unbox-robotics-logo.webp" alt="" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/kema-labs-logo.webp" alt="" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/nasa-logo.webp" alt="" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/Lucid-logo.webp" alt="" loading="lazy"></li>
      <li><img src="https://impedyme.com/wp-content/uploads/2026/11/jlg-logo.webp" alt="" class="imp-logo--tight" loading="lazy"></li>
    </ul>
  </div>
  </div>
</section>

<style>
  .imp-marquee {
    --imp-bg: #ffffff;      /* strip background */
    --imp-logo-h: 70px;     /* logo height */
    --imp-gap: 90px;        /* space between logos */
    --imp-speed: 40s;       /* time for one full loop — lower = faster */

    position: relative;
    overflow: hidden;
    width: 100%;
    padding: 60px 0;
    background: var(--imp-bg);
  }
  .imp-marquee__viewport {
    overflow: hidden;
    /* soft fade on left/right edges (logos only, not the background) */
    -webkit-mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
            mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
  }
  .imp-marquee__track {
    display: flex;
    width: max-content;
    animation: imp-marquee-scroll var(--imp-speed) linear infinite;
  }
  .imp-marquee:hover .imp-marquee__track { animation-play-state: paused; }

  .imp-marquee__group {
    display: flex;
    align-items: center;
    gap: var(--imp-gap);
    padding: 0 calc(var(--imp-gap) / 2);
    margin: 0 !important;
    list-style: none !important;
    flex-shrink: 0;
  }
  /* !important overrides theme list styles (removes the bullet dots) */
  .imp-marquee__group li {
    margin: 0 !important;
    padding: 0 !important;
    list-style: none !important;
    background: none !important;
    flex-shrink: 0;
  }
  .imp-marquee__group li::before,
  .imp-marquee__group li::after { content: none !important; display: none !important; }
  .imp-marquee__group li::marker { content: "" !important; }
  .imp-marquee__group img {
    display: block;
    height: var(--imp-logo-h);
    width: auto;
    max-width: none;
    object-fit: contain;
    border-radius: 8px;     /* rounds logos that have a background box */
  }
  /* for logo files cropped with no padding around them (e.g. JLG): shrink to match the others */
  .imp-marquee__group img.imp-logo--tight { height: calc(var(--imp-logo-h) * 0.75); }

  /* track holds 2 identical groups, so moving -50% lands exactly on the copy */
  @keyframes imp-marquee-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  @media (max-width: 768px) {
    .imp-marquee { --imp-logo-h: 46px; --imp-gap: 50px; padding: 36px 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .imp-marquee__track { animation-duration: 120s; }
  }
</style>
